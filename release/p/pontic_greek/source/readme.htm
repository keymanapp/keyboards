<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pontic Greek Keyboard</title>
  <style>
    body { font-family: sans-serif; line-height: 1.5; margin: 20px; }
    h1 { color: #1a5276; }
    code { background: #f4f4f4; padding: 2px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Pontic Greek Keyboard</h1>
  <p>Keyboard for typing Pontic Greek with full support for specialized diacritics (caron/hacek ˇ, breve ˘, and diaeresis below ̤).</p>
  <p>Includes embedded Pontic Sans font to ensure correct diacritical positioning across all platforms.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kirat Rai Keyboard - Welcome</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 20px auto; padding: 0 16px; color: #0f172a; }
    h1 { color: #d97706; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
    th { background: #f8fafc; font-weight: 600; }
    .kirat { font-family: 'Kanchenjunga', sans-serif; font-size: 20px; color: #b45309; }
  </style>
</head>
<body>
  <h1>𖵠𖵧𖵟𖵣𖵝𖵩! Kirat Rai Keyboard Guide</h1>
  <p>Type English phonetic letters to produce Kirat Rai Unicode characters:</p>

  <table>
    <tr><th>Key(s)</th><th>Kirat Rai Letter</th><th>Pronunciation</th></tr>
    <tr><td><code>k</code></td><td class="kirat">𖵄</td><td>Ka (क)</td></tr>
    <tr><td><code>kh</code> or <code>Shift+K</code></td><td class="kirat">𖵅</td><td>Kha (ख)</td></tr>
    <tr><td><code>g</code></td><td class="kirat">𖵆</td><td>Ga (ग)</td></tr>
    <tr><td><code>gh</code> or <code>Shift+G</code></td><td class="kirat">𖵇</td><td>Gha (घ)</td></tr>
    <tr><td><code>ng</code> or <code>Shift+N</code></td><td class="kirat">𖵈</td><td>Nga (ङ)</td></tr>
    <tr><td><code>s</code></td><td class="kirat">𖵠</td><td>Sa (स)</td></tr>
    <tr><td><code>r</code></td><td class="kirat">𖵟</td><td>Ra (र)</td></tr>
    <tr><td><code>w</code> or <code>v</code></td><td class="kirat">𖵝</td><td>Wa (व)</td></tr>
    <tr><td><code>.</code> (period)</td><td class="kirat">𖵮</td><td>Danda (।)</td></tr>
  </table>
</body>
</html>
